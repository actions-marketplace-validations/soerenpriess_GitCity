name: Update Git City

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/update-city.yml]

permissions:
  contents: write

concurrency: git-city

jobs:
  city:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          output: assets/city.gif
